# Main representation study: Temporal vs Spectral vs Hybrid across 4 anomaly types (M3).
# Feature set v1 frozen (D-010). Evaluated over 30 seeds with paired design.
status: active
inherit: [base, synthetic]
experiment_id: rq1_representation_v1
question: RQ1
hypotheses: research/HYPOTHESES.md#rq1
data:
  signals: [single_sinusoid, multi_sinusoid]
  anomalies: [point_spike, amplitude_change, frequency_shift, local_frequency_insertion]
  difficulty: default
  n_seeds: 30
factors:                       # full cross-product; everything else comes from base
  representation: [temporal, spectral, hybrid]
  windowing.size: [128]
controls: [random_score, robust_z]
outputs: {save_scores: true, example_plots_per_cell: 2}
